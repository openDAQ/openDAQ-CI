name: Verify reusable workflow outputs
description: Verify matrix and CMakeUserPresets generated by the reusable CI workflow

inputs:
  matrix:
    description: "Generated matrix JSON"
    required: true
  cmake-user-presets:
    description: "Generated CMakeUserPresets JSON"
    required: true
  exclude-patterns:
    description: "JSON array of wildcard patterns that should not appear in matrix"
    required: false
    default: '[]'
  configure-preset:
    description: "Expected configure preset name in inherits"
    required: true
  expect-test-presets:
    description: "Whether test presets should be present (true/false)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify
      shell: bash
      run: |
        errors=()
        matrix='${{ inputs.matrix }}'
        presets='${{ inputs.cmake-user-presets }}'
        expected_inherit='${{ inputs.configure-preset }}'
        expect_tests='${{ inputs.expect-test-presets }}'
        patterns='${{ inputs.exclude-patterns }}'

        # --- Matrix ---

        count=$(echo "$matrix" | jq '.include | length')
        echo "Matrix job count: $count"
        echo "$matrix" | jq -r '.include[].name'

        [[ $count -gt 0 ]] || errors+=("Matrix is empty")

        for pattern in $(echo "$patterns" | jq -r '.[]'); do
          match=$(echo "$matrix" | jq -r --arg p "$pattern" '.include[].name | select(test($p | gsub("\\*"; ".*") | gsub("\\." ; "\\.")))')
          if [[ -n "$match" ]]; then
            errors+=("Pattern '$pattern' should be excluded but matched: $match")
          fi
        done

        # --- Presets ---

        bad=$(echo "$presets" | jq -r --arg e "$expected_inherit" '.configurePresets[] | select(.inherits[0] != $e) | .name')
        if [[ -n "$bad" ]]; then
          errors+=("Expected all configure presets to inherit '$expected_inherit', but these don't: $bad")
        fi

        preset_names=$(echo "$presets" | jq -r '[.configurePresets[].name] | sort | join(",")')
        matrix_names=$(echo "$matrix" | jq -r '[.include[].name] | sort | join(",")')
        [[ "$preset_names" == "$matrix_names" ]] || {
          errors+=("Preset names don't match matrix. Presets: $preset_names, Matrix: $matrix_names")
        }

        test_count=$(echo "$presets" | jq '.testPresets | length')
        if [[ "$expect_tests" == "true" ]]; then
          [[ $test_count -gt 0 ]] || errors+=("Expected test presets but got 0")
        else
          [[ $test_count -eq 0 ]] || errors+=("Expected 0 test presets, got $test_count")
        fi

        # --- Summary ---

        if [[ ${#errors[@]} -gt 0 ]]; then
          for e in "${errors[@]}"; do echo "::error::$e"; done
          printf '%s\n' "${errors[@]}" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "All checks passed" >> "$GITHUB_STEP_SUMMARY"
        fi

        {
          echo "<details><summary>Matrix ($count jobs)</summary>"
          echo ""
          echo '```json'
          echo "$matrix" | jq '.'
          echo '```'
          echo ""
          echo "</details>"
          echo ""
          echo "<details><summary>CMakeUserPresets</summary>"
          echo ""
          echo '```json'
          echo "$presets" | jq '.'
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

        [[ ${#errors[@]} -eq 0 ]]
