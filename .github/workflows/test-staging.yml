name: Test Staging CI

# Exercises the whole staging chain on every PR through the `stage` facade, in two jobs:
#
#   publish  one umbrella build of hello emits BOTH component stagings (core, module) and their
#            installers from a single build, and publishes each to its own ghcr index. Producing
#            several component packages from one build is the multi-package check (Story 1.10).
#   consume  pulls hello-core back from ghcr and builds hello-module against it, with no push
#            (empty staging-push -> the `stage` facade stops after the build). The module needs
#            the core only through the registry -- the build-once / consume path.
#
# publish writes to the registry, so this workflow only ever runs on pull_request.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stage.yml
    with:
      include-jobs: >-
        [
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "manylinux_2_28-x86_64-ninja-gcc-release",
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "macos-26-x86_64-ninja-appleclang-release",
          "macos-26-armv8-ninja-appleclang-release"
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "module-no-tests"
          }
        ]
      packages: >-
        [
          { "match-jobs": ["windows-*"], "choco-install": ["nsis"] }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "stagings": [
              { "name": "core",   "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-core", "CPACK_ARCHIVE_COMPONENT_INSTALL": "ON", "CPACK_COMPONENTS_ALL": "core" } },
              { "name": "module", "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-module", "CPACK_ARCHIVE_COMPONENT_INSTALL": "ON", "CPACK_COMPONENTS_ALL": "module" } }
            ]
          },
          { "match-jobs": ["ubuntu-*", "manylinux*"], "installers": [
              { "name": "core",   "package": "DEB", "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-core", "CPACK_DEB_COMPONENT_INSTALL": "ON", "CPACK_COMPONENTS_ALL": "core" } },
              { "name": "module", "package": "DEB", "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-module", "CPACK_DEB_COMPONENT_INSTALL": "ON", "CPACK_COMPONENTS_ALL": "module" } }
          ] },
          { "match-jobs": ["windows-*"], "installers": [
              { "name": "core",   "package": "NSIS", "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-core", "CPACK_COMPONENTS_ALL": "core" } },
              { "name": "module", "package": "NSIS", "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-module", "CPACK_COMPONENTS_ALL": "module" } }
          ] },
          { "match-jobs": ["macos-*"], "installers": [
              { "name": "core",   "package": "productbuild", "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-core", "CPACK_PRODUCTBUILD_COMPONENT_INSTALL": "ON", "CPACK_COMPONENTS_ALL": "core" } },
              { "name": "module", "package": "productbuild", "variables": { "CPACK_OPENDAQ_META_PACKAGE_NAME": "hello-module", "CPACK_PRODUCTBUILD_COMPONENT_INSTALL": "ON", "CPACK_COMPONENTS_ALL": "module" } }
          ] }
        ]
      upload-pattern: hello-*
      staging-push: >-
        [
          { "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core",     "artifacts": ["hello-staging-*/core"],   "tags": ["latest"] },
          { "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-module",   "artifacts": ["hello-staging-*/module"], "tags": ["latest"] },
          { "path": "ghcr.io/${{ github.repository_owner }}/test/installer/hello-core",   "artifacts": ["hello-package-*/core"],   "tags": ["latest"] },
          { "path": "ghcr.io/${{ github.repository_owner }}/test/installer/hello-module", "artifacts": ["hello-package-*/module"], "tags": ["latest"] }
        ]

  consume:
    needs: publish
    # packages: write only to satisfy the static permission check on stage's push job --
    # this call passes no staging-push, so push is skipped and nothing is published.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stage.yml
    with:
      staging-pull: >-
        [
          { "artifact": "dep-core-ubuntu-22.04-x86_64-ninja-gcc-release",     "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "linux",           "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-ubuntu-22.04-armv8-ninja-gcc-release",      "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "linux",           "com.opendaq.settings.arch": "armv8"  } }] },
          { "artifact": "dep-core-manylinux_2_28-x86_64-ninja-gcc-release",   "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "manylinux_2_28", "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-windows-2022-x86_64-msvs-v143-release",     "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "windows",         "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-windows-2022-x86-msvs-v143-release",        "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "windows",         "com.opendaq.settings.arch": "x86"    } }] },
          { "artifact": "dep-core-macos-26-x86_64-ninja-appleclang-release",  "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "macos",           "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-macos-26-armv8-ninja-appleclang-release",   "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "macos",           "com.opendaq.settings.arch": "armv8"  } }] }
        ]
      include-jobs: >-
        [
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "manylinux_2_28-x86_64-ninja-gcc-release",
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "macos-26-x86_64-ninja-appleclang-release",
          "macos-26-armv8-ninja-appleclang-release"
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "module-no-tests",
            "cache-variables":
            {
              "HELLO_USE_INSTALLED_CORE": "ON",
              "CMAKE_PREFIX_PATH": "${sourceDir}/staging-deps"
            }
          }
        ]
      packages: >-
        [
          { "match-jobs": ["ubuntu-22.04-x86_64-*"], "artifacts": [{ "name": "dep-core-ubuntu-22.04-x86_64-*", "dir": "staging-deps" }] },
          { "match-jobs": ["ubuntu-22.04-armv8-*"],  "artifacts": [{ "name": "dep-core-ubuntu-22.04-armv8-*", "dir": "staging-deps" }] },
          { "match-jobs": ["manylinux*"],            "artifacts": [{ "name": "dep-core-manylinux*", "dir": "staging-deps" }] },
          { "match-jobs": ["windows-2022-x86_64-*"], "artifacts": [{ "name": "dep-core-windows-2022-x86_64-*", "dir": "staging-deps" }] },
          { "match-jobs": ["windows-2022-x86-*"],    "artifacts": [{ "name": "dep-core-windows-2022-x86-*", "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-x86_64-*"],     "artifacts": [{ "name": "dep-core-macos-26-x86_64-*", "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-armv8-*"],      "artifacts": [{ "name": "dep-core-macos-26-armv8-*", "dir": "staging-deps" }] }
        ]
