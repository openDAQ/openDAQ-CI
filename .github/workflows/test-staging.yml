name: Test Staging CI

# Exercises the whole staging chain on every PR through the `stage` facade: one `stage` call
# builds and publishes hello-core, a second pulls it back from ghcr and builds hello-module
# against it, then publishes the module. The module needs the core only through the registry.
# The push writes to the registry, so this workflow only ever runs on pull_request.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stage.yml
    with:
      include-jobs: >-
        [
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "manylinux_2_28-x86_64-ninja-gcc-14-release",
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "macos-26-x86_64-ninja-appleclang-21-release",
          "macos-26-armv8-ninja-appleclang-21-release"
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "module-no-tests",
            "build-targets": ["hello-core"],
            "cache-variables":
            {
              "OPENDAQ_PACKAGE_NAME_OVERRIDE": "hello-core"
            }
          }
        ]
      packages: >-
        [
          { "match-jobs": ["windows-*"], "choco-install": ["nsis"] }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "enable-staging": true,
            "variables":
            {
              "CPACK_ARCHIVE_COMPONENT_INSTALL": "ON",
              "CPACK_COMPONENTS_ALL": "core"
            }
          },
          { "match-jobs": ["ubuntu-*"],    "package": "DEB",          "variables": { "CPACK_DEB_COMPONENT_INSTALL": "ON" } },
          { "match-jobs": ["manylinux*"],  "package": "DEB",          "variables": { "CPACK_DEB_COMPONENT_INSTALL": "ON" } },
          { "match-jobs": ["windows-*"],   "package": "NSIS" },
          { "match-jobs": ["macos-*"],     "package": "productbuild", "variables": { "CPACK_PRODUCTBUILD_COMPONENT_INSTALL": "ON" } }
        ]
      upload-pattern: core-*
      staging-push: >-
        [
          { "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core",   "artifacts": ["core-staging-*"], "tags": ["latest"] },
          { "path": "ghcr.io/${{ github.repository_owner }}/test/installer/hello-core", "artifacts": ["core-package-*"], "tags": ["latest"] }
        ]

  module:
    needs: core
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stage.yml
    with:
      staging-pull: >-
        [
          { "artifact": "dep-core-ubuntu-22.04-x86_64-ninja-gcc-release",     "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "linux",           "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-ubuntu-22.04-armv8-ninja-gcc-release",      "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "linux",           "com.opendaq.settings.arch": "armv8"  } }] },
          { "artifact": "dep-core-manylinux_2_28-x86_64-ninja-gcc-14-release",   "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "manylinux_2_28", "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-windows-2022-x86_64-msvs-v143-release",     "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "windows",         "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-windows-2022-x86-msvs-v143-release",        "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "windows",         "com.opendaq.settings.arch": "x86"    } }] },
          { "artifact": "dep-core-macos-26-x86_64-ninja-appleclang-21-release",  "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "macos",           "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "dep-core-macos-26-armv8-ninja-appleclang-21-release",   "packages": [{ "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-core", "tag": "${{ github.sha }}", "annotations": { "com.opendaq.package.platform": "macos",           "com.opendaq.settings.arch": "armv8"  } }] }
        ]
      include-jobs: >-
        [
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "manylinux_2_28-x86_64-ninja-gcc-14-release",
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "macos-26-x86_64-ninja-appleclang-21-release",
          "macos-26-armv8-ninja-appleclang-21-release"
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "module-no-tests",
            "cache-variables":
            {
              "HELLO_USE_INSTALLED_CORE": "ON",
              "CMAKE_PREFIX_PATH": "${sourceDir}/staging-deps",
              "OPENDAQ_PACKAGE_NAME_OVERRIDE": "hello-module"
            }
          }
        ]
      packages: >-
        [
          { "match-jobs": ["ubuntu-22.04-x86_64-*"], "artifacts": [{ "name": "dep-core-ubuntu-22.04-x86_64-*", "dir": "staging-deps" }] },
          { "match-jobs": ["ubuntu-22.04-armv8-*"],  "artifacts": [{ "name": "dep-core-ubuntu-22.04-armv8-*", "dir": "staging-deps" }] },
          { "match-jobs": ["manylinux*"],            "artifacts": [{ "name": "dep-core-manylinux*", "dir": "staging-deps" }] },
          { "match-jobs": ["windows-2022-x86_64-*"], "choco-install": ["nsis"], "artifacts": [{ "name": "dep-core-windows-2022-x86_64-*", "dir": "staging-deps" }] },
          { "match-jobs": ["windows-2022-x86-*"],    "choco-install": ["nsis"], "artifacts": [{ "name": "dep-core-windows-2022-x86-*", "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-x86_64-*"],     "artifacts": [{ "name": "dep-core-macos-26-x86_64-*", "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-armv8-*"],      "artifacts": [{ "name": "dep-core-macos-26-armv8-*", "dir": "staging-deps" }] }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "enable-staging": true,
            "variables":
            {
              "CPACK_ARCHIVE_COMPONENT_INSTALL": "ON",
              "CPACK_COMPONENTS_ALL": "module"
            }
          },
          { "match-jobs": ["ubuntu-*"],    "package": "DEB",          "variables": { "CPACK_DEB_COMPONENT_INSTALL": "ON" } },
          { "match-jobs": ["manylinux*"],  "package": "DEB",          "variables": { "CPACK_DEB_COMPONENT_INSTALL": "ON" } },
          { "match-jobs": ["windows-*"],   "package": "NSIS" },
          { "match-jobs": ["macos-*"],     "package": "productbuild", "variables": { "CPACK_PRODUCTBUILD_COMPONENT_INSTALL": "ON" } }
        ]
      upload-pattern: module-*
      staging-push: >-
        [
          { "path": "ghcr.io/${{ github.repository_owner }}/test/staging/hello-module",   "artifacts": ["module-staging-*"], "tags": ["latest"] },
          { "path": "ghcr.io/${{ github.repository_owner }}/test/installer/hello-module", "artifacts": ["module-package-*"], "tags": ["latest"] }
        ]
