name: Staging Push

# Publishes the run's staging artifacts to an OCI registry (ghcr), under the paths the caller
# chose.
#
# One package per path -- the tag points at an OCI index, and the outputs are its untagged
# children: unreachable by name until the index lands, so a set publishes atomically, and the
# registry refuses an index with a dangling reference.
#
#   ghcr.io/opendaq/nightly/staging/opendaq : run-<run id>-<run attempt>, latest
#     └─ sha256:index…  revision=<commit>  com.opendaq.dependencies.<name>.revision=<commit>
#        ├─ sha256:a1…  title=opendaq-x86_64-linux-gcc-11-release.tar.gz
#        │              com.opendaq: platform=linux    settings.arch=x86_64  settings.compiler=gcc   settings.compiler.version=11
#        └─ sha256:b2…  title=opendaq-x86_64-windows-msvc-143-release.tar.gz
#                       com.opendaq: platform=windows  settings.arch=x86_64  settings.compiler=msvc  settings.compiler.version=194
#
# A child is named by its file; the com.opendaq.* annotations are optional, and buy a consumer a
# resolve by settings rather than by file name.
#
# The run tag is unique to its index and says nothing more: one commit built against two cores
# is two indexes, and a tag naming the commit could point at one of them only. What a package was
# built from is in its annotations: the commit itself, and the commits of its dependencies from
# its metadata, which the index repeats.
#
# NEVER prune "untagged versions" of these packages -- the live children are untagged too.
# Pruning goes through the index only.
on:
  workflow_call:
    inputs:
      staging-packages:
        description: |-
          JSON array of publish targets:
          [
            {
              "path": "ghcr.io/<org>/path/to/staging",   // the package, in full
              "artifacts": ["staging-*"],                // globs; each match becomes a child of its index
              "tags": ["latest", "v1.2.3"]               // extra tags; run-<run id>-<run attempt> is automatic
            },
            {                                            // one entry per kind: a tarball and a .deb are
              "path": "ghcr.io/<org>/path/to/package",   // variants of nothing, so they never share
              "artifacts": ["package-*"]                 // an index
            }
          ]
        type: string
        required: true

jobs:
  push:
    name: Push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download stagings
        uses: actions/download-artifact@v7
        with:
          path: .artifacts

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Push
        shell: python3 {0}
        env:
          STAGINGS: ${{ inputs.staging-packages }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          import glob, json, os, subprocess, sys
          from datetime import datetime, timezone

          PACKAGE_TYPE = "application/vnd.opendaq.package.v1"
          INDEX_TYPE   = "application/vnd.opendaq.index.v1"   # what is inside: see the descriptors
          DEPENDENCIES = "com.opendaq.dependencies."

          # The registry UI offers `docker pull` for anything it hosts, so both say what they are
          # and how to actually get a package out.
          INDEX_DESC = """Package manifest.
          1) oras manifest fetch {base}:<tag>
          2) pick an entry of manifests[] by its com.opendaq.* annotations
          3) oras pull {base}@<entry.digest>"""

          PACKAGE_DESC = """Package.
          oras pull {base}@<digest>"""

          # The kind of a package is the path the caller chose; this is only its format.
          MEDIA = {
              ".tar.gz": "application/gzip",
              ".zip":    "application/zip",
              ".deb":    "application/vnd.debian.binary-package",
              ".rpm":    "application/x-rpm",
              ".exe":    "application/vnd.microsoft.portable-executable",
              ".msi":    "application/x-msi",
              ".pkg":    "application/octet-stream",
              ".dmg":    "application/octet-stream",
          }

          def oras(*args, cwd=None, input=None):
              """Runs oras: its output; a failure fails the job."""
              print("+ oras " + " ".join(args), flush=True)
              run = subprocess.run(["oras", *args], capture_output=True, text=True, cwd=cwd, input=input)
              if run.stdout + run.stderr:
                  print((run.stdout + run.stderr).rstrip("\n"))
              if run.returncode != 0:
                  sys.exit(f"::error::oras {args[0]} failed")
              return run.stdout

          def flatten(meta, prefix="com.opendaq"):
              """staging-meta.json as annotations: nested keys joined by dots, empty values left out."""
              out = {}
              for key, value in meta.items():
                  if isinstance(value, dict):
                      out.update(flatten(value, f"{prefix}.{key}"))
                  elif value not in (None, ""):
                      out[f"{prefix}.{key}"] = str(value)
              return out

          sha     = os.environ["SHA"]
          source  = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}"
          run_tag = f"run-{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}"           # unique to this publish
          created = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")   # staging-cleanup ages by this

          stagings = json.loads(os.environ["STAGINGS"])
          for host in {s["path"].split("/")[0].lower() for s in stagings}:
              oras("login", host, "-u", os.environ["ACTOR"], "--password-stdin", input=os.environ["TOKEN"])

          summary = ["### Published packages", ""]
          for staging in stagings:
              base   = staging["path"].rstrip("/").lower()   # OCI repositories are lowercase
              tags   = list(dict.fromkeys([run_tag] + staging.get("tags", [])))
              layout = os.path.abspath(".oci/" + base.replace("/", "_"))
              dirs   = sorted({d for g in staging["artifacts"] for d in glob.glob(f".artifacts/{g}") if os.path.isdir(d)})
              if not dirs:
                  sys.exit(f"::error::no artifacts matched {staging['artifacts']}")

              # each artifact -- one payload and, optionally, staging-meta.json -- becomes an
              # annotated manifest in a local layout
              packages = {}   # digest -> annotations
              for adir in dirs:
                  files = [f for f in sorted(os.listdir(adir))
                           if f != "staging-meta.json" and os.path.isfile(os.path.join(adir, f))]
                  if len(files) != 1:
                      sys.exit(f"::error::expected one payload in {adir}, found {files}")
                  name = files[0]
                  meta = os.path.join(adir, "staging-meta.json")
                  ann  = {**(flatten(json.load(open(meta))) if os.path.exists(meta) else {}),
                          "org.opencontainers.image.title":       name,
                          "org.opencontainers.image.description": PACKAGE_DESC.format(base=base),
                          "org.opencontainers.image.revision":    sha,   # a package names its build too
                          "org.opencontainers.image.source":      source}
                  ext  = ".tar.gz" if name.endswith(".tar.gz") else os.path.splitext(name)[1].lower()
                  digest = oras("push", "--oci-layout", f"{layout}:{os.path.basename(adir)}",
                                "--artifact-type", PACKAGE_TYPE, f"{name}:{MEDIA.get(ext, 'application/octet-stream')}",
                                *[arg for key, value in ann.items() for arg in ("-a", f"{key}={value}")],
                                "--format", "go-template={{.digest}}", cwd=adir).strip()
                  packages[digest] = ann

              # what the index was built against: its packages agree on it, or it is no one build
              deps = [{k: v for k, v in ann.items() if k.startswith(DEPENDENCIES)} for ann in packages.values()]
              if any(d != deps[0] for d in deps):
                  sys.exit(f"::error::the packages of {base} differ in their {DEPENDENCIES}* annotations")

              # the index: oras leaves descriptors bare, so they carry the annotations of their
              # packages; no `platform`, which cannot tell gcc-11 from gcc-14
              oras("manifest", "index", "create", "--oci-layout", f"{layout}:tmp", *packages, "-o", "index.json")
              index = json.load(open("index.json"))
              for desc in index["manifests"]:
                  desc["annotations"] = packages[desc["digest"]]
              index["artifactType"] = INDEX_TYPE
              index["annotations"]  = {"org.opencontainers.image.created":     created,
                                       "org.opencontainers.image.description": INDEX_DESC.format(base=base),
                                       "org.opencontainers.image.revision":    sha,
                                       "org.opencontainers.image.source":      source,
                                       **deps[0]}
              json.dump(index, open("index.json", "w"), separators=(",", ":"))
              oras("manifest", "push", "--oci-layout", f"{layout}:index", "index.json",
                   "--media-type", "application/vnd.oci.image.index.v1+json")

              # one copy publishes the index with its packages; the packages land untagged
              oras("cp", "--from-oci-layout", f"{layout}:index", f"{base}:{','.join(tags)}")

              summary += [f"- `{base}`: {', '.join(f'`{t}`' for t in tags)}",
                          *[f"  - `{ann['org.opencontainers.image.title']}`" for ann in packages.values()]]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")
