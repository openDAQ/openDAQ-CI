name: Test Integration Tests CI

# Calls integration-tests.yml as a core or module repository calls it: this repository's own entry point to the
# integration tests, on a pull request that changes either workflow or by hand. The head workflow keeps
# workflow_call as its only trigger, so its callers all run it alike; triggers, the default commits and concurrency
# are this wrapper's.
#
# The default commits: core main e682217, the first with #1389, which the tests need; OpcUaModules 34f28ea and
# LTStreamingModulesModern fdad19a, the heads of their bundle/stagings branches on 2026-11-19. Core main's own stage
# preset still leaves the test utilities and native streaming out, and no core installs config_protocol yet, so the
# test build stops at configure until core stages them. Once bundle.json pins a core that meets the tests'
# requirements, the defaults go: the inputs left empty are bundle.json's own.
#
# GitHub offers "Run workflow" for a workflow on the default branch; on another branch, once its pull request has run
# it, by the API: gh workflow run test-integration-tests.yml --ref <branch> -f opendaq=<commit>
on:
  pull_request:
    paths:
      - .github/workflows/integration-tests.yml
      - .github/workflows/test-integration-tests.yml
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: core main e682217)"
        type: string
        default: ''
      opcua-modules:
        description: "OpcUaModules: a commit, branch or tag (empty: bundle/stagings 34f28ea)"
        type: string
        default: ''
      lt-streaming-modules:
        description: "LTStreamingModulesModern: a commit, branch or tag (empty: bundle/stagings fdad19a)"
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests
    permissions:
      contents: read
      packages: write     # integration-tests.yml asks for it: its resolve job stages what ghcr lacks, never pushes
    uses: ./.github/workflows/integration-tests.yml
    with:
      opendaq: ${{ inputs.opendaq || 'e6822176bc62113606808d6fa2c567c4dc6fd773' }}
      opcua-modules: ${{ inputs.opcua-modules || '34f28eaa917862fa99c5abce9f92b584c19ec7d0' }}
      lt-streaming-modules: ${{ inputs.lt-streaming-modules || 'fdad19ab14449a9f1924b9ed7499b3c0f0fd7667' }}
