name: Test Integration Tests CI

# Calls integration-tests.yml as a core or module repository calls it: this repository's own entry point to the
# integration tests, on a pull request that changes either workflow or by hand. The head workflow keeps
# workflow_call as its only trigger, so its callers all run it alike; triggers, the default commits and concurrency
# are this wrapper's.
#
# The default commits, fixed so that a run of this repository tests this repository: core main e682217, the first with
# #1389, which the tests need; OpcUaModules 34f28ea and LTStreamingModulesModern fdad19a, which built on every platform
# in run 44493334254 (their sources are their main branches' of the time). integration-tests.yml itself takes the
# heads of the main branches for the inputs left empty.
#
# By hand, bundle-run tests the stagings of that openDAQ-bundle run instead of staging them in this run. The default
# commits are then left out: a commit left empty is taken from the run's stagings, one that is given has to match.
# The run's artifacts are downloaded with this run's GITHUB_TOKEN, or with the secret OPENDAQ_BUNDLE_TOKEN (a token
# that can read openDAQ-bundle's Actions artifacts) once that is set.
#
# GitHub offers "Run workflow" for a workflow on the default branch; on another branch, once its pull request has run
# it, by the API: gh workflow run test-integration-tests.yml --ref <branch> -f opendaq=<commit> (or -f bundle-run=<id>)
on:
  pull_request:
    paths:
      - .github/workflows/integration-tests.yml
      - .github/workflows/test-integration-tests.yml
  workflow_dispatch:
    inputs:
      opendaq:
        description: "openDAQ: a commit, branch or tag (empty: core main e682217, or with bundle-run its staging's)"
        type: string
        default: ''
      opcua-modules:
        description: >-
          OpcUaModules: a commit, branch or tag (empty: bundle/stagings 34f28ea, or with bundle-run its staging's)
        type: string
        default: ''
      lt-streaming-modules:
        description: >-
          LTStreamingModulesModern: a commit, branch or tag (empty: bundle/stagings fdad19a, or with bundle-run its
          staging's)
        type: string
        default: ''
      bundle-run:
        description: "The ID of an openDAQ-bundle run whose stagings to test (empty: stage them in this run)"
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests
    permissions:
      contents: read
      packages: read      # integration-tests.yml asks for it: the test job's pull, which run mode skips
    uses: ./.github/workflows/integration-tests.yml
    with:
      opendaq: ${{ inputs.opendaq || (!inputs.bundle-run && 'e6822176bc62113606808d6fa2c567c4dc6fd773' || '') }}
      opcua-modules: >-
        ${{ inputs.opcua-modules || (!inputs.bundle-run && '34f28eaa917862fa99c5abce9f92b584c19ec7d0' || '') }}
      lt-streaming-modules: >-
        ${{ inputs.lt-streaming-modules || (!inputs.bundle-run && 'fdad19ab14449a9f1924b9ed7499b3c0f0fd7667' || '') }}
      bundle-run: ${{ inputs.bundle-run || '' }}
    secrets:
      bundle-token: ${{ secrets.OPENDAQ_BUNDLE_TOKEN }}
