name: Staging Pull

# Pulls staging packages from an OCI registry (ghcr) and uploads each set as a deps artifact
# (the packages + manifest.json) for a build to consume.
#
# Which packages is the staging-check action's answer: references, path@digest, to the packages
# whose annotations match the request, from the newest index of each package that has any. This
# workflow only downloads them. Two packages in one artifact may not share a file name -- they
# would clobber each other in the dir, so that fails loudly.
#
# One matrix job per entry uploads one artifact, so a build consumes its own deps by name.
on:
  workflow_call:
    inputs:
      staging-artifacts:
        description: |-
          JSON array of staging artifacts to materialize; each entry becomes one uploaded artifact:
          [
            {
              "artifact": "staging-<job>",                  // the artifact name to upload
              "packages": [                                  // one or more packages to pull into it
                {
                  "path": "ghcr.io/<org>/path/to/package",   // the package to resolve
                  "annotations": {                           // globs; every matching package is pulled
                    "org.opencontainers.image.revision": "<commit>",
                    "com.opendaq.custom.platform": "linux"
                  },
                  "optional": false                          // true -> resolving to nothing is a warning
                }
              ]
            }
          ]
        type: string
        required: true

jobs:
  pull:
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(inputs.staging-artifacts) }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      # staging-check of this workflow's own version: a local action is looked for in the
      # workspace, so the repository this workflow comes from is checked out there.
      - name: Get staging-check
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .openDAQ-CI

      - name: Resolve
        id: resolve
        uses: ./.openDAQ-CI/.github/actions/staging-check
        with:
          packages: ${{ format('[{0}]', toJSON(matrix.entry)) }}

      - name: Pull
        id: pull
        shell: python3 {0}
        env:
          RESOLVED: ${{ steps.resolve.outputs.resolved }}
        run: |
          import json, os, shutil, subprocess, sys, tempfile

          out = os.path.abspath("out")
          os.makedirs(out, exist_ok=True)

          pulled = []
          for package in json.loads(os.environ["RESOLVED"])[0]["packages"]:
              # each into a dir of its own first, so two packages of one name cannot clobber
              with tempfile.TemporaryDirectory() as tmp:
                  run = subprocess.run(["oras", "pull", package["path"], "-o", tmp, "--format", "json"],
                                       capture_output=True, text=True)
                  if run.returncode != 0:
                      sys.exit(f"::error::failed to pull {package['path']}\n{run.stderr}")
                  for file in json.loads(run.stdout)["files"]:
                      name = os.path.basename(file["path"])
                      if os.path.exists(os.path.join(out, name)):
                          sys.exit(f"::error::two packages share the file name {name!r}")
                      shutil.move(file["path"], os.path.join(out, name))
                      pulled.append({"path": package["path"], "title": name, "digest": file["digest"]})
                      print(f"pulled {package['path']} -> {name}")

          json.dump(pulled, open(os.path.join(out, "manifest.json"), "w"), indent=2)

          # nothing pulled -> no artifact, so a consumer sees the dependency as absent
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pulled={len(pulled)}\n")

      - name: Upload deps
        if: steps.pull.outputs.pulled != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.entry.artifact }}
          path: out
